name: Check isolated playtest recipe
on:
  push:
    branches: [codex/isolated-playtest-guide]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check playtest/prepare-isolated.mjs
      - run: node playtest/prepare-isolated.mjs --self-test
      - run: npm run check
      - run: npm run check:mixed-content
      - run: npm run build
